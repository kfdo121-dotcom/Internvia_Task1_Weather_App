<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-sky="clear-day">
<main class="app">
  <header class="bar">
    <form id="search" class="search" autocomplete="off">
      <label for="city" class="sr">City</label>
      <input id="city" type="search" placeholder="Search a city, e.g. Colombo" required>
      <button type="submit">Search</button>
    </form>
    <div class="tools">
      <button id="locate" class="ghost" type="button" title="Use my location">Use my location</button>
      <div class="units" role="group" aria-label="Units">
        <button type="button" data-unit="metric" aria-pressed="true">°C</button>
        <button type="button" data-unit="imperial" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <div id="recent" class="recent" hidden></div>
  <p id="status" class="status" role="status">Search for a city to see its weather.</p>

  <section id="weather" class="weather" hidden>
    <div class="hero">
      <p class="place"><span id="city-name"></span><small id="local-time"></small></p>
      <div class="temp-row">
        <span id="icon" class="icon" aria-hidden="true"></span>
        <span id="temp" class="temp"></span>
      </div>
      <p id="desc" class="desc"></p>
      <p id="range" class="range"></p>
    </div>

    <dl class="stats" id="stats"></dl>

    <h2>Next 5 days</h2>
    <ul class="forecast" id="forecast"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
